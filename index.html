<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Reembolsos y Gastos</title>
    <!-- Estilos limpios y modernos -->
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        h2 { color: #333; text-align: center; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #666; font-weight: bold; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background-color: #28a745; color: white; border: none; padding: 12px; width: 100%; border-radius: 4px; font-size: 16px; cursor: pointer; }
        button:hover { background-color: #218838; }
        .mensaje { margin-top: 15px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>Registro de Reembolsos</h2>
    <form id="reembolsoForm">
        <div class="form-group">
            <label for="fecha">Fecha:</label>
            <input type="date" id="fecha" required>
        </div>
        <div class="form-group">
            <label for="monto">Monto ($):</label>
            <input type="number" step="0.01" id="monto" placeholder="0.00" required>
        </div>
        <div class="form-group">
            <label for="concepto">Concepto:</label>
            <textarea id="concepto" rows="3" placeholder="Descripción del gasto..." required></textarea>
        </div>
        <div class="form-group">
            <label for="clave_reembolso">Clave de Reembolso:</label>
            <input type="text" id="clave_reembolso" placeholder="Ej. REM-001" required>
        </div>
        <div class="form-group">
            <label for="status">Status:</label>
            <select id="status">
                <option value="Pendiente">Pendiente</option>
                <option value="Aprobado">Aprobado</option>
                <option value="Pagado">Pagado</option>
            </select>
        </div>
        <button type="submit" id="btnEnviar">Guardar Registro</button>
    </form>
    <div id="mensaje" class="mensaje"></div>
</div>

<script>
    // URL de tu Web App de Google Apps Script copiada en el Paso 1
    const scriptURL = 'TU_URL_DE_APPS_SCRIPT_AQUI';

    const form = document.getElementById('reembolsoForm');
    const btnEnviar = document.getElementById('btnEnviar');
    const mensajeDiv = document.getElementById('mensaje');

    // Poner la fecha actual por defecto
    document.getElementById('fecha').valueAsDate = new Date();

    form.addEventListener('submit', e => {
        e.preventDefault();
        btnEnviar.disabled = true;
        btnEnviar.textContent = 'Guardando...';
        mensajeDiv.textContent = '';

        const datos = {
            fecha: document.getElementById('fecha').value,
            monto: document.getElementById('monto').value,
            concepto: document.getElementById('concepto').value,
            clave_reembolso: document.getElementById('clave_reembolso').value,
            status: document.getElementById('status').value
        };

        fetch(scriptURL, {
            method: 'POST',
            mode: 'no-cors', // Necesario para evitar problemas de CORS con Apps Script
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(datos)
        })
        .then(() => {
            mensajeDiv.style.color = 'green';
            mensajeDiv.textContent = '¡Registro guardado con éxito en Google Sheets!';
            form.reset();
            document.getElementById('fecha').valueAsDate = new Date(); // Resetear fecha de nuevo
            btnEnviar.disabled = false;
            btnEnviar.textContent = 'Guardar Registro';
        })
        .catch(error => {
            mensajeDiv.style.color = 'red';
            mensajeDiv.textContent = 'Error al guardar. Inténtalo de nuevo.';
            console.error('Error!', error.message);
            btnEnviar.disabled = false;
            btnEnviar.textContent = 'Guardar Registro';
        });
    });
</script>

</body>
</html>
