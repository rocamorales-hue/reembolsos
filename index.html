<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>App Financiera - Q. Bugambilia</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    :root {
      --bg-color: #f2f2f7;
      --card-bg: #ffffff;
      --primary: #007aff;
      --success: #34c759;
      --danger: #ff3b30;
      --text-main: #1c1c1e;
      --text-muted: #8e8e93;
    }

    body {
      background-color: var(--bg-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding-top: env(safe-area-inset-top);
      padding-bottom: calc(80px + env(safe-area-inset-bottom)); /* Espacio para el Tab Bar */
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    input, select { font-size: 16px !important; } /* Previene zoom en iOS */

    .app-header {
      background: rgba(242, 242, 247, 0.9);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 1000;
      padding: 15px 20px;
      border-bottom: 1px solid rgba(0,0,0,0.05);
    }

    /* Vistas de la App */
    .view-section { display: none; padding: 15px; animation: fadeIn 0.2s ease; }
    .view-section.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

    /* Tarjetas de Formularios y Datos */
    .mobile-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 1px 8px rgba(0,0,0,0.04);
    }

    /* Diseño de Lista de Datos (Reemplazo de la Tabla) */
    .data-row {
      background: #fff;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 10px;
      border-left: 4px solid transparent;
      box-shadow: 0 1px 4px rgba(0,0,0,0.03);
    }
    .data-row.border-pendiente { border-left-color: var(--danger); }
    .data-row.border-parcial { border-left-color: #ff9500; }
    .data-row.border-pagado { border-left-color: var(--success); }

    .grid-finanzas {
      display: flex;
      justify-content: space-between;
      background: #f8f9fa;
      border-radius: 8px;
      padding: 8px 12px;
      margin-top: 10px;
      font-size: 0.8rem;
    }
    .grid-finanzas div { text-align: center; }

    /* Inputs Móviles */
    .form-control { border-radius: 10px; background: #f2f2f7; border: 1px solid transparent; padding: 12px; }
    .form-control:focus { background: #fff; border-color: var(--primary); box-shadow: none; }
    
    .btn-mobile { border-radius: 12px; font-weight: 600; padding: 14px; width: 100%; border: none; }
    .btn-mobile:active { transform: scale(0.97); opacity: 0.9; }

    /* Botones de Filtro (Pills) */
    .filter-pill {
      border-radius: 20px; font-size: 0.8rem; padding: 6px 12px; margin-right: 5px;
      border: 1px solid #d1d1d6; background: #fff; color: var(--text-muted); cursor: pointer; transition: 0.2s;
    }
    .filter-pill.active { background: var(--text-main); color: #fff; border-color: var(--text-main); }

    /* Bottom Navigation Bar (Tab Bar) */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; width: 100%;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(15px);
      display: flex; justify-content: space-around;
      padding: 10px 0 calc(10px + env(safe-area-inset-bottom)) 0;
      border-top: 1px solid rgba(0,0,0,0.1);
      z-index: 1000;
    }
    .nav-item {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: var(--text-muted); font-size: 0.65rem; font-weight: 500; width: 25%; cursor: pointer;
    }
    .nav-item i { font-size: 1.2rem; margin-bottom: 4px; transition: 0.2s; }
    .nav-item.active { color: var(--primary); }
    .nav-item.active i { transform: scale(1.1); }

    /* Banner de Totales Flotante */
    .sticky-totales {
      position: sticky; top: 60px; z-index: 900;
      background: rgba(255,255,255,0.95); backdrop-filter: blur(5px);
      padding: 10px 15px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      margin-bottom: 15px; font-size: 0.8rem; display: flex; justify-content: space-between;
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <div class="app-header d-flex justify-content-between align-items-center">
    <div>
      <h5 class="fw-bold mb-0"><i class="fa-solid fa-leaf text-success me-1"></i> Quinta Bugambilia</h5>
    </div>
    <button class="btn btn-sm btn-light rounded-circle" onclick="cargarDatos()">
      <i class="fa-solid fa-rotate-right"></i>
    </button>
  </div>

  <!-- VISTA 1: REGISTRAR GASTO -->
  <div id="vista-add-gasto" class="view-section active">
    <div class="mobile-card">
      <h6 class="fw-bold text-primary mb-3"><i class="fa-solid fa-plus-circle me-1"></i> Registrar Gasto</h6>
      <div class="mb-3">
        <label class="small text-muted mb-1 fw-bold">Fecha</label>
        <input type="date" class="form-control" id="fechaGasto" required>
      </div>
      <div class="mb-3">
        <label class="small text-muted mb-1 fw-bold">Monto ($)</label>
        <input type="number" step="0.01" class="form-control" id="montoGasto" placeholder="0.00">
      </div>
      <div class="mb-4">
        <label class="small text-muted mb-1 fw-bold">Concepto / Artículo</label>
        <input type="text" class="form-control" id="conceptoGasto" placeholder="Ej. Cloro para alberca...">
      </div>
      <button class="btn-mobile bg-primary text-white" onclick="guardarGasto()">Guardar Gasto</button>
    </div>
  </div>

  <!-- VISTA 2: REGISTRAR REEMBOLSO -->
  <div id="vista-add-reembolso" class="view-section">
    <div class="mobile-card">
      <h6 class="fw-bold text-success mb-3"><i class="fa-solid fa-hand-holding-dollar me-1"></i> Recibir Reembolso</h6>
      <div class="mb-3">
        <label class="small text-muted mb-1 fw-bold">Fecha</label>
        <input type="date" class="form-control" id="fechaReembolso" required>
      </div>
      <div class="mb-3">
        <label class="small text-muted mb-1 fw-bold">Monto Depositado ($)</label>
        <input type="number" step="0.01" class="form-control" id="montoReembolso" placeholder="0.00">
      </div>
      <div class="mb-4">
        <label class="small text-muted mb-1 fw-bold">Notas / Referencia</label>
        <input type="text" class="form-control" id="notasReembolso" placeholder="Opcional...">
      </div>
      <button class="btn-mobile bg-success text-white" onclick="procesarReembolso()">Aplicar a Deudas</button>
    </div>
  </div>

  <!-- VISTA 3: HISTORIAL DE GASTOS -->
  <div id="vista-historial-gastos" class="view-section">
    
    <!-- Filtros Superiores -->
    <div class="mb-3">
      <input type="text" class="form-control mb-2" id="searchConcepto" placeholder="🔍 Buscar concepto..." onkeyup="renderGastos()">
      <div class="d-flex overflow-auto pb-1" style="white-space: nowrap;">
        <button class="filter-pill active" id="f-Pendiente" onclick="toggleFiltro('Pendiente')">Pendientes</button>
        <button class="filter-pill active" id="f-Parcial" onclick="toggleFiltro('Parcial')">Parciales</button>
        <button class="filter-pill" id="f-Pagado" onclick="toggleFiltro('Pagado')">Pagados</button>
      </div>
    </div>

    <!-- Banner de Totales Dinámico -->
    <div class="sticky-totales">
      <div class="text-center">
        <div class="text-muted" style="font-size:0.7rem">COSTO TOTAL</div>
        <div class="fw-bold" id="totalCosto">$0</div>
      </div>
      <div class="text-center">
        <div class="text-muted" style="font-size:0.7rem">ABONADO</div>
        <div class="fw-bold text-success" id="totalAbonado">$0</div>
      </div>
      <div class="text-center">
        <div class="text-muted" style="font-size:0.7rem">PENDIENTE</div>
        <div class="fw-bold text-danger" id="totalPendiente">$0</div>
      </div>
    </div>

    <!-- Contenedor de Tarjetas de Gastos -->
    <div id="lista-gastos"></div>
  </div>

  <!-- VISTA 4: HISTORIAL DE REEMBOLSOS -->
  <div id="vista-historial-reembolsos" class="view-section">
    <div class="mobile-card bg-success bg-opacity-10 mb-3 border-0">
      <div class="text-center">
        <div class="text-muted small fw-bold">TOTAL HISTÓRICO REEMBOLSADO</div>
        <h2 class="text-success fw-bold mb-0" id="granTotalReembolsos">$0.00</h2>
      </div>
    </div>
    <div id="lista-reembolsos"></div>
  </div>

  <!-- BOTTOM NAVIGATION BAR -->
  <nav class="bottom-nav">
    <div class="nav-item active" onclick="navTo('vista-add-gasto', this)">
      <i class="fa-solid fa-cart-plus"></i><span>Gasto</span>
    </div>
    <div class="nav-item" onclick="navTo('vista-add-reembolso', this)">
      <i class="fa-solid fa-money-bill-transfer"></i><span>Abono</span>
    </div>
    <div class="nav-item" onclick="navTo('vista-historial-gastos', this)">
      <i class="fa-solid fa-list-check"></i><span>Gastos</span>
    </div>
    <div class="nav-item" onclick="navTo('vista-historial-reembolsos', this)">
      <i class="fa-solid fa-vault"></i><span>Reembolsos</span>
    </div>
  </nav>

<script>
  // URL de tu API
  const API_URL = "https://script.google.com/macros/s/AKfycbz-IgvNztN2FAmFc13XDjqtu-fRxNnOihXTWlTDfSqBVIepK8FpiommOCU6YOU9gUBB/exec";
  
  let DB_Gastos = [];
  let DB_Reembolsos = [];
  let filtrosActivos = new Set(['Pendiente', 'Parcial']); // Por defecto

  document.addEventListener('DOMContentLoaded', () => {
    const hoy = new Date().toISOString().split('T')[0];
    document.getElementById('fechaGasto').value = hoy;
    document.getElementById('fechaReembolso').value = hoy;
    cargarDatos();
  });

  // Navegación estilo App
  function navTo(viewId, btnElement) {
    document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
    document.getElementById(viewId).classList.add('active');
    btnElement.classList.add('active');
  }

  // Lógica de Filtros (Pills)
  function toggleFiltro(estatus) {
    const btn = document.getElementById(`f-${estatus}`);
    if (filtrosActivos.has(estatus)) {
      filtrosActivos.delete(estatus);
      btn.classList.remove('active');
    } else {
      filtrosActivos.add(estatus);
      btn.classList.add('active');
    }
    renderGastos();
  }

  // Obtener Datos del Servidor
  function cargarDatos() {
    Swal.fire({ title: 'Sincronizando...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
    
    fetch(API_URL + "?action=obtenerDatos")
      .then(res => res.json())
      .then(res => {
        if(res.status === 'success') {
          DB_Gastos = res.gastos.reverse(); // Más recientes arriba
          DB_Reembolsos = res.reembolsos.reverse();
          renderGastos();
          renderReembolsos();
          Swal.close();
        } else {
          Swal.fire('Error', res.message, 'error');
        }
      })
      .catch(err => Swal.fire('Error de Red', err.message, 'error'));
  }

  // --- RENDERIZAR VISTA DE GASTOS (TARJETAS) ---
  function renderGastos() {
    const search = document.getElementById('searchConcepto').value.toLowerCase();
    const contenedor = document.getElementById('lista-gastos');
    contenedor.innerHTML = '';
    
    let sumCosto = 0, sumAbonado = 0, sumPend = 0;

    const filtrados = DB_Gastos.filter(fila => {
      const pasaTexto = fila[2].toLowerCase().includes(search);
      const pasaEstatus = filtrosActivos.has(fila[6]);
      return pasaTexto && pasaEstatus;
    });

    if (filtrados.length === 0) {
      contenedor.innerHTML = '<div class="text-center text-muted mt-5"><i class="fa-solid fa-folder-open fs-1 mb-2"></i><br>No hay datos.</div>';
    } else {
      filtrados.forEach(fila => {
        // [0]ID, [1]Fecha, [2]Concepto, [3]Costo, [4]Abonado, [5]Saldo, [6]Estatus
        const d = new Date(fila[1]).toLocaleDateString('es-MX', {timeZone: 'UTC', day:'2-digit', month:'short', year:'numeric'});
        const estatusClase = fila[6].toLowerCase(); // pendiente, parcial, pagado
        
        sumCosto += parseFloat(fila[3])||0;
        sumAbonado += parseFloat(fila[4])||0;
        sumPend += parseFloat(fila[5])||0;

        contenedor.innerHTML += `
          <div class="data-row border-${estatusClase}">
            <div class="d-flex justify-content-between align-items-start mb-1">
              <span class="fw-bold text-dark lh-sm pe-2">${fila[2]}</span>
              <span class="badge bg-${estatusClase === 'pagado' ? 'success' : (estatusClase === 'parcial' ? 'warning text-dark' : 'danger')}">${fila[6]}</span>
            </div>
            <div class="text-muted" style="font-size: 0.75rem;">
              <i class="fa-regular fa-calendar me-1"></i>${d} &nbsp;|&nbsp; <i class="fa-solid fa-hashtag me-1"></i>${fila[0]}
            </div>
            
            <div class="grid-finanzas">
              <div>
                <div class="text-muted fw-bold">Original</div>
                <div class="text-dark">${fmt(fila[3])}</div>
              </div>
              <div>
                <div class="text-muted fw-bold">Abonado</div>
                <div class="text-success">${fmt(fila[4])}</div>
              </div>
              <div>
                <div class="text-muted fw-bold">Resta</div>
                <div class="text-danger fw-bold">${fmt(fila[5])}</div>
              </div>
            </div>
          </div>
        `;
      });
    }

    document.getElementById('totalCosto').innerText = fmt(sumCosto);
    document.getElementById('totalAbonado').innerText = fmt(sumAbonado);
    document.getElementById('totalPendiente').innerText = fmt(sumPend);
  }

  // --- RENDERIZAR VISTA DE REEMBOLSOS (TARJETAS) ---
  function renderReembolsos() {
    const contenedor = document.getElementById('lista-reembolsos');
    contenedor.innerHTML = '';
    let total = 0;

    if (DB_Reembolsos.length === 0) {
      contenedor.innerHTML = '<div class="text-center text-muted mt-5"><i class="fa-solid fa-receipt fs-1 mb-2"></i><br>No hay reembolsos registrados.</div>';
    } else {
      DB_Reembolsos.forEach(fila => {
        // [0]ID, [1]Fecha, [2]Monto, [3]Notas
        const d = new Date(fila[1]).toLocaleDateString('es-MX', {timeZone: 'UTC', day:'2-digit', month:'short', year:'numeric'});
        total += parseFloat(fila[2])||0;
        
        contenedor.innerHTML += `
          <div class="mobile-card border-start border-success border-4 ps-3 py-3">
            <div class="d-flex justify-content-between align-items-center">
              <span class="fw-bold text-success fs-5">+${fmt(fila[2])}</span>
              <span class="text-muted small"><i class="fa-regular fa-calendar me-1"></i>${d}</span>
            </div>
            ${fila[3] ? `<div class="text-dark small mt-2 fw-medium"><i class="fa-solid fa-message me-1 text-muted"></i>${fila[3]}</div>` : ''}
            <div class="text-muted mt-2" style="font-size: 0.65rem;"><i class="fa-solid fa-hashtag me-1"></i>${fila[0]}</div>
          </div>
        `;
      });
    }
    document.getElementById('granTotalReembolsos').innerText = fmt(total);
  }

  // --- ACCIONES (Guardar) ---
  function guardarGasto() {
    const fecha = document.getElementById('fechaGasto').value;
    const concepto = document.getElementById('conceptoGasto').value;
    const monto = document.getElementById('montoGasto').value;

    if (!fecha || !concepto || !monto) return Swal.fire('Alto', 'Completa todos los campos', 'warning');
    Swal.fire({ title: 'Guardando...', didOpen: () => Swal.showLoading() });

    fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "registrarGasto", fecha, concepto, monto }) })
      .then(res => res.json()).then(res => {
        if(res.status === 'success') {
          document.getElementById('conceptoGasto').value = ''; document.getElementById('montoGasto').value = '';
          Swal.fire({title: '¡Guardado!', icon: 'success', timer: 1500, showConfirmButton: false});
          cargarDatos();
        }
      });
  }

  function procesarReembolso() {
    const fecha = document.getElementById('fechaReembolso').value;
    const monto = document.getElementById('montoReembolso').value;
    const notas = document.getElementById('notasReembolso').value;

    if (!fecha || !monto) return Swal.fire('Alto', 'Indica fecha y monto', 'warning');
    Swal.fire({ title: 'Procesando...', text: 'Abonando en cascada...', didOpen: () => Swal.showLoading() });

    fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "registrarReembolso", fecha, monto, notas }) })
      .then(res => res.json()).then(res => {
        if(res.status === 'success') {
          document.getElementById('montoReembolso').value = ''; document.getElementById('notasReembolso').value = '';
          Swal.fire('¡Éxito!', res.saldoRestante > 0 ? `Quedó saldo a favor: ${fmt(res.saldoRestante)}` : 'Deudas liquidadas.', 'success');
          cargarDatos();
        }
      });
  }

  function fmt(v) { return new Intl.NumberFormat('es-MX', {style:'currency', currency:'MXN'}).format(v||0); }
</script>
</body>
</html>
